# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing (OIDC): no token to store.
# One-time setup on npmjs.com: package settings -> Trusted publisher -> GitHub Actions, repo aeratic/pagetailor, workflow publish.yml.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public --provenance
